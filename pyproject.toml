[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alterseek-path"
version = "1.0.0"
description = "Generate altermagnetic k-point paths for VASP, Quantum ESPRESSO, and ABINIT workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "sympy>=1.13",
    "spglib>=2.7",
    "findspingroup>=0.15.6",
    "ase>=3.23",
    "seekpath>=2.1",
    "pymatgen>=2024.11",
]

[project.scripts]
alterseek-path = "alterseek_path:main"
alterseek-plot = "alterseek_plot:main"

[tool.setuptools]
py-modules = [
    "alterseek_path",
    "alterseek_plot",
]

[tool.setuptools.packages.find]
include = ["alterseek*", "plotting*"]
